<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>සජීවී 3D Model</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        #model-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        
        .info-overlay {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            backdrop-filter: blur(10px);
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 12px;
            opacity: 0;
            animation: fadeIn 1s ease 0.5s forwards;
        }
        
        @keyframes fadeIn {
            to { opacity: 1; }
        }
        
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #4ade80;
            animation: pulse 2s infinite;
        }
        
        .status-dot.talking {
            background: #f59e0b;
            animation: talk 0.3s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.9); }
        }
        
        @keyframes talk {
            0%, 100% { 
                transform: scale(1); 
                box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7); 
            }
            50% { 
                transform: scale(1.3); 
                box-shadow: 0 0 0 8px rgba(245, 158, 11, 0); 
            }
        }
    </style>
</head>
<body>
    <div id="model-container">
        <div class="info-overlay">
            <div class="status-dot" id="status-dot"></div>
            <span id="status-text">සජීවී 3D Model</span>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let scene, camera, renderer, controls, model, mixer, clock;
        let headBone = null;
        let jawBone = null;
        let eyeBones = [];
        
        // Animation parameters
        let isTalking = false;
        let talkCycle = 0;
        let blinkCycle = 0;
        let breatheCycle = 0;
        let headMoveCycle = 0;

        function init3D() {
            const container = document.getElementById('model-container');
            
            scene = new THREE.Scene();
            
            // Beautiful animated background
            const canvas = document.createElement('canvas');
            canvas.width = 2;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createLinearGradient(0, 0, 0, 512);
            gradient.addColorStop(0, '#667eea');
            gradient.addColorStop(0.5, '#764ba2');
            gradient.addColorStop(1, '#1e3c72');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 2, 512);
            
            const texture = new THREE.CanvasTexture(canvas);
            scene.background = texture;
            
            camera = new THREE.PerspectiveCamera(
                50,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            camera.position.set(0, 1.6, 4.5);
            
            renderer = new THREE.WebGLRenderer({ 
                antialias: true, 
                alpha: true,
                powerPreference: "high-performance"
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.3;
            container.appendChild(renderer.domElement);
            
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 2.5;
            controls.maxDistance = 8;
            controls.maxPolarAngle = Math.PI / 1.7;
            controls.enablePan = false;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.5;
            
            // Professional lighting setup
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);
            
            const keyLight = new THREE.DirectionalLight(0xffffff, 1.5);
            keyLight.position.set(5, 10, 7);
            keyLight.castShadow = true;
            keyLight.shadow.mapSize.width = 2048;
            keyLight.shadow.mapSize.height = 2048;
            keyLight.shadow.camera.near = 0.5;
            keyLight.shadow.camera.far = 50;
            scene.add(keyLight);
            
            const fillLight = new THREE.DirectionalLight(0xffd7a8, 0.6);
            fillLight.position.set(-5, 5, -3);
            scene.add(fillLight);
            
            const rimLight = new THREE.DirectionalLight(0xadd8ff, 0.5);
            rimLight.position.set(0, 5, -10);
            scene.add(rimLight);
            
            const spotLight = new THREE.SpotLight(0xffffff, 0.8);
            spotLight.position.set(0, 12, 0);
            spotLight.angle = Math.PI / 5;
            spotLight.penumbra = 0.4;
            spotLight.decay = 2;
            spotLight.distance = 30;
            spotLight.castShadow = true;
            scene.add(spotLight);
            
            // Atmospheric particles
            const particlesGeometry = new THREE.BufferGeometry();
            const particlesCount = 150;
            const positions = new Float32Array(particlesCount * 3);
            
            for(let i = 0; i < particlesCount * 3; i++) {
                positions[i] = (Math.random() - 0.5) * 25;
            }
            
            particlesGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const particlesMaterial = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 0.04,
                transparent: true,
                opacity: 0.5,
                blending: THREE.AdditiveBlending
            });
            
            const particles = new THREE.Points(particlesGeometry, particlesMaterial);
            scene.add(particles);
            
            clock = new THREE.Clock();
            
            loadModel();
            
            window.addEventListener('resize', onWindowResize);
            
            animate();
            
            // Start talking animation after model loads
            setTimeout(() => {
                startTalking();
            }, 3000);
        }
        
        function loadModel() {
            const loader = new GLTFLoader();
            loader.load(
                '610201d9-8d0b-405d-9a0f-f3a3ca9e5169.glb',
                function(gltf) {
                    model = gltf.scene;
                    
                    model.traverse((child) => {
                        if (child.isMesh) {
                            child.castShadow = true;
                            child.receiveShadow = true;
                            
                            if (child.material) {
                                child.material.envMapIntensity = 1.3;
                                child.material.roughness = 0.6;
                                child.material.metalness = 0.1;
                            }
                        }
                        
                        // Find bones for animation
                        if (child.isBone) {
                            const name = child.name.toLowerCase();
                            if (name.includes('head') || name.includes('neck')) {
                                headBone = child;
                            }
                            if (name.includes('jaw') || name.includes('chin') || name.includes('mouth')) {
                                jawBone = child;
                            }
                            if (name.includes('eye')) {
                                eyeBones.push(child);
                            }
                        }
                    });
                    
                    scene.add(model);
                    
                    // Setup model animations from file
                    if (gltf.animations && gltf.animations.length) {
                        mixer = new THREE.AnimationMixer(model);
                        gltf.animations.forEach((clip) => {
                            const action = mixer.clipAction(clip);
                            action.setLoop(THREE.LoopRepeat);
                            action.play();
                        });
                    }
                    
                    // Center and scale model
                    const box = new THREE.Box3().setFromObject(model);
                    const center = box.getCenter(new THREE.Vector3());
                    const size = box.getSize(new THREE.Vector3());
                    
                    const maxDim = Math.max(size.x, size.y, size.z);
                    const scale = 3.2 / maxDim;
                    model.scale.multiplyScalar(scale);
                    
                    model.position.sub(center.multiplyScalar(scale));
                    model.position.y = -0.2;
                },
                undefined,
                function(error) {
                    console.error('Error loading model:', error);
                }
            );
        }
        
        function startTalking() {
            isTalking = true;
            updateStatus(true);
            
            // Continue talking in cycles
            setInterval(() => {
                isTalking = !isTalking;
                updateStatus(isTalking);
            }, Math.random() * 8000 + 5000); // Random intervals between 5-13 seconds
        }
        
        function updateStatus(talking) {
            const statusDot = document.getElementById('status-dot');
            const statusText = document.getElementById('status-text');
            
            if (talking) {
                statusDot.classList.add('talking');
                statusText.textContent = 'කතා කරනවා...';
            } else {
                statusDot.classList.remove('talking');
                statusText.textContent = 'සජීවී 3D Model';
            }
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            const delta = clock.getDelta();
            const time = clock.getElapsedTime();
            
            // Update model animations from file
            if (mixer) {
                mixer.update(delta);
            }
            
            if (model) {
                // Breathing animation (always active)
                breatheCycle += delta * 1.5;
                model.position.y = -0.2 + Math.sin(breatheCycle) * 0.02;
                model.scale.y = 3.2 / Math.max(2, 2) + Math.sin(breatheCycle) * 0.005;
                
                if (isTalking) {
                    // Active talking animation
                    talkCycle += delta * 8;
                    headMoveCycle += delta * 2;
                    
                    if (headBone) {
                        // Natural head movements while talking
                        headBone.rotation.y = Math.sin(headMoveCycle) * 0.2 + Math.sin(headMoveCycle * 2.3) * 0.1;
                        headBone.rotation.x = Math.sin(headMoveCycle * 1.3) * 0.12 + 0.05;
                        headBone.rotation.z = Math.cos(headMoveCycle * 0.8) * 0.08;
                    }
                    
                    if (jawBone) {
                        // Jaw movement for talking
                        jawBone.rotation.x = Math.abs(Math.sin(talkCycle)) * 0.15;
                    }
                    
                    // Body sway while talking
                    model.rotation.y += Math.sin(headMoveCycle * 0.5) * 0.0015;
                    model.rotation.x = Math.sin(headMoveCycle * 0.7) * 0.02;
                    
                } else {
                    // Idle animation
                    headMoveCycle += delta * 0.5;
                    
                    if (headBone) {
                        // Subtle idle head movements
                        headBone.rotation.y = Math.sin(headMoveCycle) * 0.08;
                        headBone.rotation.x = Math.sin(headMoveCycle * 1.5) * 0.05;
                        headBone.rotation.z = Math.cos(headMoveCycle * 0.7) * 0.03;
                    }
                    
                    if (jawBone) {
                        // Slight jaw relaxation
                        jawBone.rotation.x = Math.sin(time * 0.3) * 0.02;
                    }
                }
                
                // Blinking animation (always active)
                blinkCycle += delta;
                if (blinkCycle > 3 + Math.random() * 2) {
                    blinkCycle = 0;
                    // Quick blink
                    eyeBones.forEach(bone => {
                        bone.scale.y = 0.1;
                        setTimeout(() => bone.scale.y = 1, 100);
                    });
                }
            }
            
            controls.update();
            renderer.render(scene, camera);
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        init3D();
    </script>
</body>
</html>
