<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talking 3D Avatar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            max-width: 1200px;
            width: 100%;
        }

        h1 {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            text-align: center;
            font-size: 28px;
        }

        #canvas-container {
            width: 100%;
            height: 500px;
            background: linear-gradient(180deg, #f0f0f0 0%, #e0e0e0 100%);
            position: relative;
            overflow: hidden;
        }

        #renderCanvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
        }

        .controls {
            padding: 30px;
            background: #f8f9fa;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            font-family: inherit;
            resize: vertical;
            min-height: 100px;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 150px;
            padding: 15px 25px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        #speakBtn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        #speakBtn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        #stopBtn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        #stopBtn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245, 87, 108, 0.4);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            background: #e3f2fd;
            color: #1976d2;
            text-align: center;
            font-weight: 500;
            display: none;
        }

        .status.active {
            display: block;
        }

        .status.speaking {
            background: #c8e6c9;
            color: #388e3c;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .settings {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .setting-item {
            display: flex;
            flex-direction: column;
        }

        select, input[type="range"] {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }

        input[type="range"] {
            padding: 0;
        }

        .range-value {
            text-align: center;
            margin-top: 5px;
            font-weight: 600;
            color: #667eea;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #667eea;
            font-size: 18px;
            font-weight: 600;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎭 Talking 3D Avatar</h1>
        
        <div id="canvas-container">
            <canvas id="renderCanvas"></canvas>
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <div>Loading 3D Model...</div>
            </div>
        </div>

        <div class="controls">
            <div class="settings">
                <div class="setting-item">
                    <label for="voiceSelect">Voice:</label>
                    <select id="voiceSelect">
                        <option value="">Loading voices...</option>
                    </select>
                </div>
                
                <div class="setting-item">
                    <label for="rateControl">Speed:</label>
                    <input type="range" id="rateControl" min="0.5" max="2" step="0.1" value="1">
                    <div class="range-value" id="rateValue">1.0x</div>
                </div>
                
                <div class="setting-item">
                    <label for="pitchControl">Pitch:</label>
                    <input type="range" id="pitchControl" min="0.5" max="2" step="0.1" value="1">
                    <div class="range-value" id="pitchValue">1.0x</div>
                </div>
            </div>

            <div class="input-group">
                <label for="textInput">Type what you want the avatar to say:</label>
                <textarea 
                    id="textInput" 
                    placeholder="Example: හලෝ! මම 3D Avatar කෙනෙක්. මට ඕනෑම භාෂාවකින් කතා කරන්න පුළුවන්!"
                >හලෝ! මම 3D Avatar කෙනෙක්. මට ඕනෑම භාෂාවකින් කතා කරන්න පුළුවන්!</textarea>
            </div>

            <div class="button-group">
                <button id="speakBtn">🎤 Speak</button>
                <button id="stopBtn" disabled>⏹️ Stop</button>
            </div>

            <div class="status" id="status"></div>
        </div>
    </div>

    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>

    <script>
        let scene, camera, model, mixer;
        let isSpeaking = false;
        let currentUtterance = null;
        let animationInterval = null;

        // Initialize Babylon.js scene
        const canvas = document.getElementById('renderCanvas');
        const engine = new BABYLON.Engine(canvas, true);

        function createScene() {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0.9, 0.9, 0.95, 1);

            // Camera
            const camera = new BABYLON.ArcRotateCamera(
                "camera",
                -Math.PI / 2,
                Math.PI / 2.5,
                3,
                new BABYLON.Vector3(0, 1, 0),
                scene
            );
            camera.attachControl(canvas, true);
            camera.lowerRadiusLimit = 2;
            camera.upperRadiusLimit = 10;
            camera.wheelPrecision = 50;

            // Lights
            const light1 = new BABYLON.HemisphericLight(
                "light1",
                new BABYLON.Vector3(0, 1, 0),
                scene
            );
            light1.intensity = 0.7;

            const light2 = new BABYLON.DirectionalLight(
                "light2",
                new BABYLON.Vector3(-1, -2, -1),
                scene
            );
            light2.intensity = 0.5;

            return scene;
        }

        scene = createScene();

        // Load the GLB model
        BABYLON.SceneLoader.ImportMesh(
            "",
            "/mnt/user-data/uploads/",
            "6634bd3a-9260-4bc5-adaf-eb863b7f4970.glb",
            scene,
            function (meshes) {
                model = meshes[0];
                
                // Center and scale the model
                const boundingBox = model.getHierarchyBoundingVectors();
                const size = boundingBox.max.subtract(boundingBox.min);
                const maxDimension = Math.max(size.x, size.y, size.z);
                const scaleFactor = 2 / maxDimension;
                
                model.scaling = new BABYLON.Vector3(scaleFactor, scaleFactor, scaleFactor);
                
                const center = boundingBox.min.add(size.scale(0.5));
                model.position = center.scale(-scaleFactor);

                document.getElementById('loading').style.display = 'none';
                showStatus('Model loaded successfully! ✅', false);
            },
            null,
            function (scene, message) {
                console.error('Error loading model:', message);
                document.getElementById('loading').innerHTML = 
                    '<div style="color: #f5576c;">Error loading model. Please check the file.</div>';
            }
        );

        engine.runRenderLoop(() => {
            scene.render();
        });

        window.addEventListener('resize', () => {
            engine.resize();
        });

        // Text-to-Speech with lip sync simulation
        const synth = window.speechSynthesis;
        let voices = [];

        function loadVoices() {
            voices = synth.getVoices();
            const voiceSelect = document.getElementById('voiceSelect');
            voiceSelect.innerHTML = '';
            
            if (voices.length === 0) {
                voiceSelect.innerHTML = '<option>No voices available</option>';
                return;
            }

            voices.forEach((voice, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = `${voice.name} (${voice.lang})`;
                if (voice.default) {
                    option.selected = true;
                }
                voiceSelect.appendChild(option);
            });
        }

        // Load voices
        loadVoices();
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = loadVoices;
        }

        // Range controls
        document.getElementById('rateControl').addEventListener('input', (e) => {
            document.getElementById('rateValue').textContent = e.target.value + 'x';
        });

        document.getElementById('pitchControl').addEventListener('input', (e) => {
            document.getElementById('pitchValue').textContent = e.target.value + 'x';
        });

        function showStatus(message, isSpeaking) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = 'status active' + (isSpeaking ? ' speaking' : '');
        }

        function animateModel() {
            if (!model) return;
            
            // Simulate talking animation by slight rotation and scaling
            let phase = 0;
            animationInterval = setInterval(() => {
                if (model) {
                    phase += 0.2;
                    // Slight head bob
                    model.rotation.y = Math.sin(phase) * 0.05;
                    // Slight scale pulse (simulating jaw movement)
                    const scaleVariation = 1 + Math.sin(phase * 2) * 0.02;
                    const currentScale = model.scaling.x;
                    model.scaling.y = currentScale * scaleVariation;
                }
            }, 50);
        }

        function stopAnimation() {
            if (animationInterval) {
                clearInterval(animationInterval);
                animationInterval = null;
            }
            if (model) {
                model.rotation.y = 0;
                const baseScale = model.scaling.x;
                model.scaling.y = baseScale;
            }
        }

        document.getElementById('speakBtn').addEventListener('click', () => {
            const text = document.getElementById('textInput').value.trim();
            
            if (!text) {
                showStatus('Please enter some text first! ⚠️', false);
                return;
            }

            if (isSpeaking) {
                synth.cancel();
            }

            const utterance = new SpeechSynthesisUtterance(text);
            
            const voiceIndex = document.getElementById('voiceSelect').value;
            if (voiceIndex && voices[voiceIndex]) {
                utterance.voice = voices[voiceIndex];
            }
            
            utterance.rate = parseFloat(document.getElementById('rateControl').value);
            utterance.pitch = parseFloat(document.getElementById('pitchControl').value);

            utterance.onstart = () => {
                isSpeaking = true;
                document.getElementById('speakBtn').disabled = true;
                document.getElementById('stopBtn').disabled = false;
                showStatus('Speaking... 🎤', true);
                animateModel();
            };

            utterance.onend = () => {
                isSpeaking = false;
                document.getElementById('speakBtn').disabled = false;
                document.getElementById('stopBtn').disabled = true;
                showStatus('Finished speaking ✅', false);
                stopAnimation();
            };

            utterance.onerror = (event) => {
                isSpeaking = false;
                document.getElementById('speakBtn').disabled = false;
                document.getElementById('stopBtn').disabled = true;
                showStatus('Error occurred ❌', false);
                stopAnimation();
            };

            currentUtterance = utterance;
            synth.speak(utterance);
        });

        document.getElementById('stopBtn').addEventListener('click', () => {
            if (synth.speaking) {
                synth.cancel();
            }
            isSpeaking = false;
            document.getElementById('speakBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            showStatus('Stopped ⏹️', false);
            stopAnimation();
        });

        // Enter key to speak
        document.getElementById('textInput').addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') {
                document.getElementById('speakBtn').click();
            }
        });
    </script>
</body>
</html>
